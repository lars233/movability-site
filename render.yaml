# Render Blueprint for the Movability site + CMS.
# One web service serves the React site, the API and the admin panel from a
# single origin, with a persistent disk for the SQLite database and uploads.
services:
  - type: web
    name: movability-site
    runtime: node
    plan: starter          # 512 MB / always on. "free" spins down and has no disk.
    region: frankfurt      # closest Render region to Oslo
    branch: main
    autoDeploy: true
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm run build
    startCommand: pnpm --filter @workspace/api-server run start
    healthCheckPath: /api/healthz
    disk:
      name: movability-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      # Generated by Render on first deploy and kept secret.
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      # Set in the Render dashboard — never committed.
      # Generate with: node artifacts/api-server/hash-password.mjs 'your password'
      - key: ADMIN_PASSWORD_HASH
        sync: false
      # Database and uploads live on the persistent disk so deploys don't wipe them.
      - key: CMS_DB_PATH
        value: /var/data/database.sqlite
      - key: UPLOADS_DIR
        value: /var/data/uploads
